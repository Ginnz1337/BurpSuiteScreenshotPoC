// Not the supported build path. This project is built with build.ps1 or build.bat, which also
// run the verification suite. This file has never been executed: Gradle is not installed on the
// development machine and there is no wrapper. Kept only for an IDE import.
plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'burp.screenshot'
version = '1.0.0'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    implementation 'com.google.code.gson:gson:2.10.1'
}

shadowJar {
    archiveBaseName.set('burp-screenshot-poc')
    archiveClassifier.set('')
    archiveVersion.set('1.0.0')
}

tasks.build.dependsOn tasks.shadowJar
